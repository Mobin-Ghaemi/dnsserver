<div class="activity-items">{% for item in activities %}<div class="activity-item"><span class="activity-dot">{% include 'icon.html' with name='clock' %}</span><div><strong>{{ item.action }}</strong><span dir="ltr">{{ item.zone_name }}</span>{% if item.detail %}<small>{{ item.detail }}</small>{% endif %}</div><time datetime="{{ item.created_at|date:'c' }}">{{ item.created_at|date:'Y/m/d · H:i' }}</time></div>{% empty %}<div class="compact-empty">{% include 'icon.html' with name='clock' %}<p>هنوز تغییری ثبت نشده است.</p></div>{% endfor %}</div>
