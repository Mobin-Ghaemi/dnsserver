# Replace dns-panel.your-domain.tld and certificate paths, then nginx -t.
# Install certificates BEFORE enabling this HTTPS virtual host.
server {
    listen 80;
    server_name dns-panel.your-domain.tld;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name dns-panel.your-domain.tld;
    ssl_certificate /etc/letsencrypt/live/dns-panel.your-domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns-panel.your-domain.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 125s;
        proxy_connect_timeout 5s;
    }
}
