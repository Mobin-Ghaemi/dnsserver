# Active entry point: direct IP, with its own publicly trusted certificate.
server {
 listen 80;
 listen [::]:80;
 server_name 62.60.211.103;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 302 https://62.60.211.103$request_uri; }
}
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name 62.60.211.103;
 ssl_certificate /etc/letsencrypt-orbit-ip/live/orbit-dns-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt-orbit-ip/live/orbit-dns-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 1m;
 access_log /var/log/nginx/orbit-dns.access.log;
 error_log /var/log/nginx/orbit-dns.error.log;
 location / {
  proxy_pass http://127.0.0.1:18009;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 125s;
 }
}
# Preserve old bookmarks while moving the panel to its independent IP address.
server {
 listen 80;
 listen [::]:80;
 server_name dns.melkata.ir;
 return 302 https://62.60.211.103$request_uri;
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name dns.melkata.ir;
 ssl_certificate /etc/letsencrypt/live/melkata.ir/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/melkata.ir/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 return 302 https://62.60.211.103$request_uri;
}
